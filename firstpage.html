<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mahi ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
overflow:hidden;
}

.container{
width:90%;
max-width:350px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(12px);
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
color:#fff;
font-size:28px;
margin-bottom:15px;
}

p{
color:white;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
outline:none;
font-size:16px;
margin-bottom:20px;
}

button{
padding:12px 30px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#ff1744;
transform:scale(1.05);
}

#error{
margin-top:15px;
color:yellow;
font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<h1>❤️ Welcome Mahi ❤️</h1>

<p>Enter the Secret Password</p>

<input type="password" id="password" placeholder="Password">

<button onclick="checkPassword()">Unlock</button>

<p id="error"></p>

</div>

<script>

function checkPassword(){

let pass=document.getElementById("password").value;

if(pass==="MahiDharani"){

window.location.href="heart.html";

}

else{

document.getElementById("error").innerHTML="Wrong Password ❤️ Try Again";

}

}

</script>

</body>
</html>
