<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Mahi ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100%;
height:100%;
overflow:hidden;
background:#000;

font-family:'Dancing Script',cursive;

}

canvas{

display:block;

}

#title{

position:absolute;

top:35px;

left:50%;

transform:translateX(-50%);

font-size:34px;

color:#ff66cc;

opacity:0;

transition:1s;

text-shadow:0 0 25px #ff66cc;

z-index:10;

}

#envelope{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%) scale(0);

font-size:90px;

cursor:pointer;

transition:.4s;

z-index:20;

}

#next{

position:absolute;

left:50%;

top:88%;

transform:translateX(-50%);

padding:16px 38px;

border:none;

border-radius:35px;

background:#ff4d88;

color:white;

font-size:22px;

cursor:pointer;

display:none;

box-shadow:0 0 25px hotpink;

transition:.2s;

font-family:Arial;

}

#next:hover{

transform:translateX(-50%) scale(1.08);

background:#ff1f6d;

}

</style>

</head>

<body>

<canvas id="canvas"></canvas>

<div id="title">

❤️ Creating Our Love... ❤️

</div>

<div id="envelope">

💌

</div>

<button id="next">

Open My Letter ❤️

</button>

<script>

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

function resize(){

canvas.width=window.innerWidth;

canvas.height=window.innerHeight;

}

resize();

window.addEventListener("resize",resize);

const stars=[];

const STAR_COUNT=1500;

class Star{

constructor(){

this.reset();

}

reset(){

this.x=Math.random()*canvas.width;

this.y=Math.random()*canvas.height;

this.tx=this.x;

this.ty=this.y;

this.vx=0;

this.vy=0;

this.size=Math.random()*2+0.8;

this.speed=0.018+Math.random()*0.02;

this.color=`hsl(${300+Math.random()*40},100%,65%)`;

}

update(){

this.x+=(this.tx-this.x)*this.speed;

this.y+=(this.ty-this.y)*this.speed;

}

draw(){

ctx.beginPath();

ctx.fillStyle=this.color;

ctx.shadowBlur=18;

ctx.shadowColor=this.color;

ctx.arc(this.x,this.y,this.size,0,Math.PI*2);

ctx.fill();

}

}

for(let i=0;i<STAR_COUNT;i++){

stars.push(new Star());

}

let frame=0;

let exploded=false;

// ======================================
// PART 2
// ======================================

function heartPoint(t){

    const x = 16*Math.pow(Math.sin(t),3);

    const y =
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);

    return{

        x:canvas.width/2 + x*16,

        y:canvas.height/2 - y*16

    };

}

function swirlStars(){

    stars.forEach((s,i)=>{

        let angle = frame*0.02 + i*0.08;

        let radius = 250 + 80*Math.sin(i);

        s.tx = canvas.width/2 + Math.cos(angle)*radius;

        s.ty = canvas.height/2 + Math.sin(angle)*radius;

    });

}

function formHeart(){

    stars.forEach((s,i)=>{

        let a = (i/stars.length)*Math.PI*2;

        let p = heartPoint(a);

        s.tx = p.x;

        s.ty = p.y;

    });

}

function explode(){

    exploded = true;

    stars.forEach(s=>{

        let a = Math.random()*Math.PI*2;

        let speed = 4 + Math.random()*6;

        s.vx = Math.cos(a)*speed;

        s.vy = Math.sin(a)*speed;

    });

}

function updateExplosion(){

    stars.forEach(s=>{

        s.x += s.vx;

        s.y += s.vy;

        s.vx *= 0.98;

        s.vy *= 0.98;

    });

}

// ======================================
// PART 3
// METEOR HEART + GLOW EFFECT
// ======================================


const meteors=[];


function createMeteor(){

    let meteor={

        x:Math.random()*canvas.width,

        y:-50,

        speed:5+Math.random()*6,

        length:50+Math.random()*80

    };


    meteors.push(meteor);

}



function drawMeteors(){

    meteors.forEach((m,index)=>{


        let gradient=ctx.createLinearGradient(
            m.x,
            m.y,
            m.x-m.length,
            m.y+m.length
        );


        gradient.addColorStop(0,"white");

        gradient.addColorStop(0.4,"pink");

        gradient.addColorStop(1,"transparent");


        ctx.beginPath();

        ctx.strokeStyle=gradient;

        ctx.lineWidth=3;

        ctx.moveTo(m.x,m.y);

        ctx.lineTo(
            m.x-m.length,
            m.y+m.length
        );

        ctx.stroke();



        m.x-=m.speed;

        m.y+=m.speed;



        if(m.y>canvas.height+100){

            meteors.splice(index,1);

        }


    });

}



function heartGlow(){

    let glow=25+Math.sin(frame*0.08)*15;


    ctx.shadowBlur=glow;

    ctx.shadowColor="#ff1493";


}



// ======================================
// MAIN ANIMATION LOOP
// ======================================


function animate(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    frame++;


    stars.forEach(s=>{

        s.update();

        s.draw();

    });



    if(frame<200){

        swirlStars();

    }


    else if(frame<500){

        formHeart();

        document.getElementById("title").style.opacity=1;

    }


    else if(frame>500 && !exploded){

        setTimeout(()=>{

            explode();

            document.getElementById("envelope").style.transform=
            "translate(-50%,-50%) scale(1)";


        },1000);


    }


    if(exploded){

        updateExplosion();

        heartGlow();


        if(Math.random()<0.08){

            createMeteor();

        }


        drawMeteors();

    }


    requestAnimationFrame(animate);

}


animate();


// ======================================
// ENVELOPE CLICK
// ======================================


document.getElementById("envelope").onclick=function(){


    document.getElementById("next").style.display="block";


};



document.getElementById("next").onclick=function(){


    window.location.href="letters.html";


};

</script>

</body>

</html>
