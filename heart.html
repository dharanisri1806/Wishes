<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mahi ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Poppins',sans-serif;
background:
radial-gradient(circle at top,#ffe6f2 0%,#ffd3ea 40%,#ffc2df 70%,#ffb0d4 100%);
}

body{
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* ---------- Floating Background ---------- */

.backgroundGlow{
position:absolute;
inset:0;
overflow:hidden;
z-index:0;
}

.backgroundGlow span{
position:absolute;
display:block;
border-radius:50%;
background:rgba(255,255,255,.25);
animation:floatBg linear infinite;
}

@keyframes floatBg{

0%{
transform:translateY(120vh) scale(.5);
opacity:0;
}

20%{
opacity:.4;
}

80%{
opacity:.2;
}

100%{
transform:translateY(-120vh) scale(1.4);
opacity:0;
}

}

/* ---------- Main Scene ---------- */

.scene{
position:relative;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* ---------- Heart Container ---------- */

.heartWrapper{
position:absolute;
width:420px;
height:380px;
display:flex;
justify-content:center;
align-items:center;
transition:1.3s;
opacity:0;
transform:scale(.6);
}

.heartWrapper.show{
opacity:1;
transform:scale(1);
}

.heartParticle{
position:absolute;
width:8px;
height:8px;
background:#ff2f73;
transform:rotate(45deg);
animation:tinyBeat 2s infinite;
}

.heartParticle::before,
.heartParticle::after{
content:"";
position:absolute;
width:8px;
height:8px;
background:#ff2f73;
border-radius:50%;
}

.heartParticle::before{
left:-4px;
}

.heartParticle::after{
top:-4px;
}

@keyframes tinyBeat{

0%,100%{
transform:rotate(45deg) scale(1);
}

50%{
transform:rotate(45deg) scale(1.18);
}

}

/* ---------- Center Text ---------- */

.centerBeat{
position:absolute;
width:210px;
height:210px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-family:'Dancing Script',cursive;
font-size:34px;
font-weight:bold;
color:#fff;
text-shadow:
0 0 10px #ff4f9c,
0 0 20px #ff8bc4,
0 0 40px #fff;
animation:mainBeat 1.4s ease-in-out infinite;
z-index:10;
}

@keyframes mainBeat{

0%{
transform:scale(1);
}

25%{
transform:scale(1.08);
}

40%{
transform:scale(1.22);
}

60%{
transform:scale(1);
}

100%{
transform:scale(1);
}

}

/* ---------- Glitter ---------- */

.glitterContainer{
position:absolute;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:4;
}

.glitter{
position:absolute;
width:4px;
height:4px;
border-radius:50%;
background:white;
opacity:0;
}

/* ---------- Envelope ---------- */

.envelopeScene{
position:absolute;
display:flex;
justify-content:center;
align-items:center;
opacity:0;
transform:scale(.7);
transition:1.5s;
z-index:20;
}

.envelopeScene.show{
opacity:1;
transform:scale(1);
}

.envelope{
position:relative;
width:280px;
height:180px;
}

.envBack{
position:absolute;
bottom:0;
width:100%;
height:100%;
background:#ff82b8;
border-radius:0 0 12px 12px;
}

.envLeft{
position:absolute;
left:0;
bottom:0;
width:0;
height:0;
border-top:90px solid transparent;
border-bottom:90px solid transparent;
border-left:140px solid #ff9cc7;
}

.envRight{
position:absolute;
right:0;
bottom:0;
width:0;
height:0;
border-top:90px solid transparent;
border-bottom:90px solid transparent;
border-right:140px solid #ff74af;
}

.envBottom{
position:absolute;
bottom:0;
left:0;
width:0;
height:0;
border-left:140px solid transparent;
border-right:140px solid transparent;
border-bottom:90px solid #ff66a7;
}

.envFlap{
position:absolute;
top:0;
left:0;
width:0;
height:0;
transform-origin:top;
border-left:140px solid transparent;
border-right:140px solid transparent;
border-top:90px solid #ff4d97;
z-index:10;
transition:1.8s ease;
}

.envLetter{
position:absolute;
left:20px;
bottom:10px;
width:240px;
height:145px;
background:white;
border-radius:10px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
transition:2s;
z-index:1;
}

.open .envFlap{
transform:rotateX(180deg);
}

.open .envLetter{
transform:translateY(-170px);
}

@media(max-width:480px){

.heartWrapper{
width:320px;
height:300px;
}

.centerBeat{
width:170px;
height:170px;
font-size:28px;
}

.envelope{
transform:scale(.9);
}

}

</style>
</head>
<body>

<div class="backgroundGlow" id="backgroundGlow"></div>

<div class="scene">

<div class="heartWrapper" id="heartWrapper">

<div class="centerBeat">
Dharani ❤️<br>Mahendra
</div>
</div>

<div class="glitterContainer" id="glitterContainer"></div>

<div class="envelopeScene" id="envelopeScene">

<div class="envelope" id="envelope">

<div class="envBack"></div>
<div class="envLeft"></div>
<div class="envRight"></div>
<div class="envBottom"></div>

<div class="envLetter"></div>

<div class="envFlap"></div>

</div>

</div>

</div>

<script>

const bg=document.getElementById("backgroundGlow");

for(let i=0;i<40;i++){

const b=document.createElement("span");

const s=Math.random()*80+20;

b.style.width=s+"px";
b.style.height=s+"px";
b.style.left=Math.random()*100+"%";
b.style.animationDuration=(18+Math.random()*18)+"s";
b.style.animationDelay=(-Math.random()*30)+"s";

bg.appendChild(b);

}

/* ---------- PERFECT HEART ---------- */

const wrapper=document.getElementById("heartWrapper");

const TOTAL=140;

for(let i=0;i<TOTAL;i++){

const t=(Math.PI*2*i)/TOTAL;

const x=16*Math.pow(Math.sin(t),3);

const y=
13*Math.cos(t)
-
5*Math.cos(2*t)
-
2*Math.cos(3*t)
-
Math.cos(4*t);

const dot=document.createElement("div");

dot.className="heartParticle";

dot.style.left=(210+x*11)+"px";

dot.style.top=(175-y*11)+"px";

dot.style.animationDelay=(Math.random()*1.5)+"s";

wrapper.appendChild(dot);

}

setTimeout(()=>{

wrapper.classList.add("show");

},400);

/* ---------- GLITTER EXPLOSION ---------- */

function glitterBlast(){

const box=document.getElementById("glitterContainer");

for(let i=0;i<260;i++){

const g=document.createElement("div");

g.className="glitter";

const angle=Math.random()*Math.PI*2;

const speed=120+Math.random()*240;

const dx=Math.cos(angle)*speed;

const dy=Math.sin(angle)*speed;

g.style.left="50%";
g.style.top="50%";

box.appendChild(g);

g.animate(

[
{
transform:"translate(0,0) scale(0)",
opacity:1
},
{
transform:`translate(${dx}px,${dy}px) scale(${Math.random()*2+0.5})`,
opacity:0
}
],
{
duration:1700,
easing:"cubic-bezier(.2,.8,.2,1)"
}

);

setTimeout(()=>g.remove(),1800);

}

}
/* ---------- TIMELINE ---------- */

const envelopeScene=document.getElementById("envelopeScene");
const envelope=document.getElementById("envelope");

setTimeout(()=>{

glitterBlast();

},2400);

setTimeout(()=>{

wrapper.style.transition="1.4s";
wrapper.style.opacity="0";
wrapper.style.transform="scale(.4)";

},4300);

setTimeout(()=>{

envelopeScene.classList.add("show");

},5600);

setTimeout(()=>{

envelope.classList.add("open");

},7600);

/* ---------- EXTRA SPARKLES ---------- */

function sparkle(){

const s=document.createElement("div");

s.className="glitter";

s.style.opacity=".9";
s.style.width=(2+Math.random()*4)+"px";
s.style.height=s.style.width;

s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";

document.getElementById("glitterContainer").appendChild(s);

s.animate(
[
{
opacity:0,
transform:"scale(0)"
},
{
opacity:1,
transform:"scale(1.6)"
},
{
opacity:0,
transform:"scale(0)"
}
],
{
duration:1500+Math.random()*1200
}
);

setTimeout(()=>s.remove(),3000);

}

setInterval(sparkle,180);
/* ---------- REDIRECT ---------- */

setTimeout(()=>{

window.location.href="letter.html";

},10800);

/* ---------- OPTIONAL HEART FLOATERS ---------- */

function floatingHeart(){

const h=document.createElement("div");

h.innerHTML="❤";

h.style.position="fixed";
h.style.left=Math.random()*100+"vw";
h.style.bottom="-30px";
h.style.fontSize=(8+Math.random()*10)+"px";
h.style.color="rgba(255,255,255,.8)";
h.style.pointerEvents="none";
h.style.zIndex="2";

document.body.appendChild(h);

h.animate(
[
{
transform:"translateY(0) scale(0.5)",
opacity:0
},
{
opacity:1
},
{
transform:`translateY(-${window.innerHeight+100}px)
translateX(${(Math.random()-0.5)*120}px)
scale(1.2)`,
opacity:0
}
],
{
duration:6000+Math.random()*2500,
easing:"linear"
}
);

setTimeout(()=>h.remove(),9000);

}

setInterval(floatingHeart,300);

</script>

</body>
</html>
