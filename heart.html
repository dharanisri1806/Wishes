<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Mahi ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Dancing Script',cursive;
background:linear-gradient(135deg,#ff9ec4,#ffd6e8,#ffeef5);
}

/* Floating Hearts */

.hearts{
position:fixed;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;
z-index:0;
}

.hearts span{
position:absolute;
bottom:-50px;
font-size:22px;
animation:floatHeart linear infinite;
opacity:.8;
}

.hearts span:nth-child(1){left:5%;animation-duration:10s;}
.hearts span:nth-child(2){left:15%;animation-duration:8s;}
.hearts span:nth-child(3){left:25%;animation-duration:12s;}
.hearts span:nth-child(4){left:35%;animation-duration:9s;}
.hearts span:nth-child(5){left:45%;animation-duration:11s;}
.hearts span:nth-child(6){left:55%;animation-duration:8s;}
.hearts span:nth-child(7){left:65%;animation-duration:13s;}
.hearts span:nth-child(8){left:75%;animation-duration:10s;}
.hearts span:nth-child(9){left:85%;animation-duration:12s;}
.hearts span:nth-child(10){left:95%;animation-duration:9s;}

@keyframes floatHeart{

0%{
transform:translateY(0) rotate(0deg);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}

}

/* Center Container */

.container{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
position:relative;
z-index:5;
}

/* Envelope */

.envelope{
position:relative;
width:320px;
height:220px;
cursor:pointer;
transition:.5s;
}

.envelope:hover{
transform:scale(1.02);
}

/* Body */

.envelope-body{
position:absolute;
bottom:0;
width:100%;
height:170px;
background:#ff5e8a;
border-radius:0 0 12px 12px;
z-index:2;
box-shadow:0 12px 25px rgba(0,0,0,.2);
}

/* Left Fold */

.left-fold{
position:absolute;
bottom:0;
left:0;
width:0;
height:0;
border-top:85px solid transparent;
border-bottom:85px solid transparent;
border-right:160px solid #ff7aa2;
z-index:3;
}

/* Right Fold */

.right-fold{
position:absolute;
bottom:0;
right:0;
width:0;
height:0;
border-top:85px solid transparent;
border-bottom:85px solid transparent;
border-left:160px solid #ff7098;
z-index:3;
}

/* Bottom Fold */

.bottom-fold{
position:absolute;
bottom:0;
width:0;
height:0;
border-left:160px solid transparent;
border-right:160px solid transparent;
border-top:100px solid #ff88ad;
z-index:4;
}

/* Top Flap */

.top-flap{
position:absolute;
top:0;
width:0;
height:0;
border-left:160px solid transparent;
border-right:160px solid transparent;
border-bottom:110px solid #ff3f76;
transform-origin:top;
transition:1.5s;
z-index:5;
}

/* Letter */

.letter{
position:absolute;
left:50%;
bottom:20px;
transform:translateX(-50%);
width:88%;
height:160px;
background:white;
border-radius:10px;
box-shadow:0 10px 20px rgba(0,0,0,.2);
padding:20px;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-size:28px;
font-weight:bold;
color:#ff3f76;
transition:1.8s;
z-index:1;
}

.envelope.open .top-flap{
transform:rotateX(180deg);
z-index:0;
}

.envelope.open .letter{
bottom:210px;
height:500px;
width:92vw;
max-width:420px;
overflow-y:auto;
padding:30px 25px;
}

/* Hidden Letter Content */

#letterContent{
display:none;
opacity:0;
transition:1.5s;
font-size:22px;
line-height:1.9;
color:#444;
text-align:left;
}

#letterContent h1{
text-align:center;
color:#ff2f72;
margin-bottom:20px;
}

#letterContent p{
margin-bottom:15px;
}

#nextBtn{

display:none;

margin:30px auto;

padding:15px 35px;

font-size:20px;

border:none;

border-radius:50px;

background:#ff3f76;

color:white;

cursor:pointer;

box-shadow:0 0 20px #ff3f76;

animation:glow 1.5s infinite;

}

@keyframes glow{

0%{box-shadow:0 0 5px #ff3f76;}

50%{box-shadow:0 0 25px #ff3f76;}

100%{box-shadow:0 0 5px #ff3f76;}

}

audio{
display:none;
}

</style>

</head>

<body>

<div class="hearts">

<span>❤️</span>
<span>💖</span>
<span>💕</span>
<span>💗</span>
<span>💝</span>
<span>❤️</span>
<span>💖</span>
<span>💕</span>
<span>💗</span>
<span>💝</span>

</div>

<div class="container">

<div class="envelope" id="envelope">

<div class="top-flap"></div>

<div class="left-fold"></div>

<div class="right-fold"></div>

<div class="bottom-fold"></div>

<div class="envelope-body"></div>

<div class="letter" id="letter">
Click Me ❤️
</div>

</div>

</div>
